<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة والطقس في صلاح الدين</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1a2e">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #080f1a url('https://images.unsplash.com/photo-1542816417-0983cbe82752?q=80&w=1000&auto=format&fit=crop') no-repeat center top/cover fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(8, 15, 26, 0.65) 0%, rgba(8, 15, 26, 0.92) 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* اختيار القضاء */
        .district-card {
            background: rgba(16, 30, 50, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .district-card label {
            font-size: 0.85rem;
            color: #f1c40f;
            font-weight: 700;
        }
        .district-card select {
            background: #101e32;
            color: #ffffff;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            outline: none;
        }

        /* شريط التاريخ */
        .date-card {
            background: rgba(16, 30, 50, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* كارت الصلاة القادمة (اللون الأخضر) */
        .next-prayer-card {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.85) 0%, rgba(16, 185, 129, 0.5) 100%);
            border: 1px solid rgba(52, 211, 153, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-prayer-info h3 { font-size: 0.75rem; color: #a7f3d0; }
        .next-prayer-info h2 { font-size: 1.4rem; color: #ffffff; margin: 2px 0; }
        .sub-text { font-size: 0.7rem; color: #d1fae5; }
        .countdown { font-size: 1.3rem; font-weight: 800; font-family: monospace; direction: ltr; }

        /* مواقيت الصلاة اليوم */
        .prayers-section {
            background: rgba(16, 30, 50, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 12px;
        }
        .section-title { font-size: 0.85rem; color: #38bdf8; margin-bottom: 8px; font-weight: 600; }
        .prayers-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .p-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 2px;
            text-align: center;
        }
        .p-box.active { background: rgba(56, 189, 248, 0.25); border-color: #38bdf8; }
        .p-icon { font-size: 1rem; }
        .p-name { font-size: 0.68rem; color: #94a3b8; margin: 2px 0; }
        .p-time { font-size: 0.72rem; font-weight: 700; direction: ltr; }

        /* كارت الطقس */
        .weather-card {
            background: rgba(16, 30, 50, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 14px;
        }
        .weather-main { display: flex; justify-content: space-between; align-items: center; }
        .temp-display { font-size: 2.6rem; font-weight: 900; }
        .city-title { font-size: 0.95rem; font-weight: 700; color: #38bdf8; }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 0.68rem;
        }

        .footer {
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
            margin: 8px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="container">

        <!-- اختيار المنطقة -->
        <div class="district-card">
            <label for="districtSelect">📍 القضاء / الناحية:</label>
            <select id="districtSelect" onchange="loadDistrictData()">
                <option value="Tikrit,34.60,43.68,تكريت">تكريت (المركز)</option>
                <option value="Shirqat,35.48,43.25,الشرقاط">الشرقاط</option>
                <option value="Samarra,34.20,43.87,سامراء">سامراء</option>
                <option value="Baiji,34.93,43.49,بيجي">بيجي</option>
                <option value="Balad,34.01,44.14,بلد">بلد</option>
                <option value="Dujail,33.84,44.23,الدجيل">الدجيل</option>
                <option value="TuzKhurmatu,34.88,44.63,طوزخورماتو">طوزخورماتو</option>
                <option value="AlDaur,34.45,43.79,الدور">الدور</option>
            </select>
        </div>

        <!-- التاريخ والمكان -->
        <div class="date-card">
            <div id="gregorianDate">📅 جاري التحميل...</div>
            <div id="hijriDate">🌙 جاري التحميل...</div>
        </div>

        <!-- الصلاة القادمة -->
        <div class="next-prayer-card">
            <div class="next-prayer-info">
                <h3>الصلاة القادمة</h3>
                <h2 id="nextPrayerName">--</h2>
                <div class="sub-text">باقي على الصلاة</div>
            </div>
            <div class="countdown" id="countdown">00:00:00</div>
        </div>

        <!-- مواقيت الصلاة اليوم -->
        <div class="prayers-section">
            <div class="section-title">🕌 مواقيت الصلاة (إمساكية الوقف السني)</div>
            <div class="prayers-grid" id="prayersGrid"></div>
        </div>

        <!-- الطقس -->
        <div class="weather-card">
            <div class="weather-main">
                <div>
                    <div class="city-title" id="displayCityName">📍 تكريت</div>
                    <div style="font-size: 0.8rem; color:#cbd5e1;">مشمس / صافي</div>
                </div>
                <div class="temp-display" id="temp">--°</div>
            </div>
            <div class="forecast-grid" id="forecastGrid"></div>
        </div>

        <!-- الهامش والحقوق -->
        <div class="footer">
            تصميم محمد علي احمد الحطاب الجبوري
        </div>
    </div>

    <script>
        let prayerTimes = {};

        function format12Hour(timeStr) {
            if (!timeStr) return '';
            let clean = timeStr.split(' ')[0];
            let [hours, minutes] = clean.split(':');
            hours = parseInt(hours, 10);
            hours = hours % 12 || 12;
            return `${hours}:${minutes}`;
        }

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('gregorianDate').textContent = `📅 ${now.toLocaleDateString('ar-IQ', options)}`;
            updateCountdown();
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function loadDistrictData() {
            const select = document.getElementById('districtSelect');
            const [cityName, lat, lon, arName] = select.value.split(',');

            document.getElementById('displayCityName').textContent = `📍 ${arName}`;

            // 1. جلب مواقيت الصلاة (الوقف السني - Method 5)
            try {
                const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`);
                const data = await res.json();
                const t = data.data.timings;
                prayerTimes = t;

                const h = data.data.date.hijri;
                document.getElementById('hijriDate').textContent = `🌙 ${h.day} ${h.month.ar} ${h.year} هـ`;

                const pList = [
                    { key: 'Fajr', name: 'الفجر', icon: '🌅', time: format12Hour(t.Fajr) },
                    { key: 'Sunrise', name: 'الشروق', icon: '☀️', time: format12Hour(t.Sunrise) },
                    { key: 'Dhuhr', name: 'الظهر', icon: '🌤️', time: format12Hour(t.Dhuhr) },
                    { key: 'Asr', name: 'العصر', icon: '🌥️', time: format12Hour(t.Asr) },
                    { key: 'Maghrib', name: 'المغرب', icon: '🌅', time: format12Hour(t.Maghrib) },
                    { key: 'Isha', name: 'العشاء', icon: '🌙', time: format12Hour(t.Isha) }
                ];

                let html = '';
                pList.forEach(p => {
                    html += `
                        <div class="p-box" id="p-${p.key}">
                            <div class="p-icon">${p.icon}</div>
                            <div class="p-name">${p.name}</div>
                            <div class="p-time">${p.time}</div>
                        </div>
                    `;
                });
                document.getElementById('prayersGrid').innerHTML = html;
                updateCountdown();
            } catch (e) {
                console.error("خطأ في جلب المواعيد", e);
            }

            // 2. جلب الطقس
            try {
                const resW = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBaghdad`);
                const dataW = await resW.json();
                document.getElementById('temp').textContent = `${Math.round(dataW.current_weather.temperature)}°`;

                const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                let fHtml = '';
                for (let i = 0; i < 5; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    fHtml += `
                        <div>
                            <div>${days[d.getDay()]}</div>
                            <div style="margin:2px 0;">☀️</div>
                            <div>${Math.round(dataW.daily.temperature_2m_max[i])}° / ${Math.round(dataW.daily.temperature_2m_min[i])}°</div>
                        </div>
                    `;
                }
                document.getElementById('forecastGrid').innerHTML = fHtml;
            } catch (e) {
                document.getElementById('temp').textContent = '--°';
            }
        }

        function updateCountdown() {
            if (!prayerTimes.Fajr) return;
            const now = new Date();
            const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            const names = { Fajr: 'صلاة الفجر', Dhuhr: 'صلاة الظهر', Asr: 'صلاة العصر', Maghrib: 'صلاة المغرب', Isha: 'صلاة العشاء' };

            let nextP = null;
            let nextPTime = null;

            for (let key of list) {
                const [h, m] = prayerTimes[key].split(' ')[0].split(':');
                const pDate = new Date();
                pDate.setHours(parseInt(h), parseInt(m), 0, 0);

                if (pDate > now) {
                    nextP = key;
                    nextPTime = pDate;
                    break;
                }
            }

            if (!nextP) {
                const [h, m] = prayerTimes['Fajr'].split(' ')[0].split(':');
                nextPTime = new Date();
                nextPTime.setDate(nextPTime.getDate() + 1);
                nextPTime.setHours(parseInt(h), parseInt(m), 0, 0);
                nextP = 'Fajr';
            }

            document.getElementById('nextPrayerName').textContent = names[nextP];
            document.querySelectorAll('.p-box').forEach(b => b.classList.remove('active'));
            const activeCard = document.getElementById(`p-${nextP}`);
            if (activeCard) activeCard.classList.add('active');

            const diff = nextPTime - now;
            const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').textContent = 
                `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        loadDistrictData();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
